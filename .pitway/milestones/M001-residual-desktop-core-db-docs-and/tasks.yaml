  - id: T012
    name: Fix bg-thread connection close (D-03)
    objective: Make _close_pooled_conn() deterministically release background-thread
      sqlcipher handles. The pool opener currently opens connections with the
      driver default check_same_thread=True, so the main thread's close() raises
      ProgrammingError that shutdown.py swallows — the handle stays open and
      usable on the owner thread (real D-03 leak), breaking shutdown()/restore
      semantics.
    status: completed
    depends_on:
      - T001
    acceptance_criteria:
      - Pooled connections open with check_same_thread=False so the pool owner
        (main thread) can close background-thread handles.
      - "_close_pooled_conn() provably renders each tracked background handle
        unusable: the regression probe in tests/test_db_pool.py passes."
      - Pool and mixin regression tests pass.
    context_files:
      - skyadmin_pro/db/cipher/funcs_0.py
      - skyadmin_pro/db/core/connect_b.py
      - skyadmin_pro/db/core/bg_conn_b.py
      - skyadmin_pro/db/core/shutdown.py
      - skyadmin_pro/db/core/pool.py
      - tests/test_db_pool.py
    write_scope:
      - skyadmin_pro/db/cipher/funcs_0.py
