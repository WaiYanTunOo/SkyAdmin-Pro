[build-system]
requires = ["setuptools>=68.0", "wheel", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skyadmin-pro"
version = "0.3.7"
description = "Offline desktop workflow for corporate services administrators"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Wai Yan Tun Oo", email = "dev.skycreation@gmail.com"},
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "pyinstaller>=6.0.0",
    "Cython>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["skyadmin_pro*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
# N999/N802: Wave D7 camelCase mixin module/method names are intentional.
ignore = ["E501", "SIM105", "N999", "N802", "N803", "N806", "N815"]

[tool.ruff.lint.per-file-ignores]
# Wave D7 package facades and chunk splits re-export / star-import by design.
"__init__.py" = ["F401", "F811", "E402", "F403"]
"skyadmin_pro/db/**" = ["F821", "F841"]
"skyadmin_pro/services/**" = ["F403", "F405", "F821", "F822", "F841", "E402"]
"skyadmin_pro/ui/views/**" = ["F821", "F841"]
"examples/*" = ["N802", "N815"]
"skyadmin_pro/ui/views/anti_gravity.py" = ["N802", "N815", "N803"]
"tests/test_data_sync.py" = ["SIM102"]
"tests/test_db_mixins.py" = ["F841"]
"scripts/*" = ["SIM102", "SIM108", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["skyadmin_pro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "release: pre-ship build and integration gates (via scripts/release_check.py)",
    "walkthrough: offscreen UI walkthrough helpers (Phase 4/5)",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "skyadmin_pro.ui.*",
    "customtkinter",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "skyadmin_pro.services.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "skyadmin_pro.db.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "skyadmin_pro.config.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "skyadmin_pro.config.__init__"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "skyadmin_pro.services.workflow"
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "skyadmin_pro.services.translate"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "skyadmin_pro.services.snippets"
disallow_untyped_defs = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "skyadmin_pro.db.cipher"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlcipher3.dbapi2"
ignore_missing_imports = true
