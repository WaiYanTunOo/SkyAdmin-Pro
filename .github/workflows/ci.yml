name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        if: matrix.python-version == '3.12'
        run: ruff check .

      - name: Check formatting with ruff
        if: matrix.python-version == '3.12'
        run: ruff format --check .

      - name: Run tests
        run: xvfb-run pytest tests/ -v --tb=short --ignore=tests/test_performance_clients.py --ignore=tests/test_performance_stress.py
        env:
          SKYADMIN_SKIP_DAILY_CHECK: "1"
          SKYADMIN_PROCESS_OFFLOAD: "0"

      - name: Audit Python dependencies
        if: matrix.python-version == '3.12'
        # PYSEC-2022-252: historical PyPI account takeover of deep-translator;
        # no fixed release exists; 1.11.4 is the current upstream line.
        run: pip-audit --strict --ignore-vuln PYSEC-2022-252

      - name: Security scan with bandit
        if: matrix.python-version == '3.12'
        # B608: f-string SQL with bound ? placeholders (IN-clause builders), not user SQL.
        run: bandit -r skyadmin_pro/ --severity-level medium --skip B608

      - name: Security scan with semgrep
        if: matrix.python-version == '3.12'
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python

  python-windows:
    # Windows CI job: catches Windows-only issues on every PR (previously only at release).
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v --tb=short --ignore=tests/test_performance_clients.py --ignore=tests/test_performance_stress.py
        env:
          SKYADMIN_SKIP_DAILY_CHECK: "1"
          SKYADMIN_PROCESS_OFFLOAD: "0"

      - name: Audit Python dependencies
        if: matrix.python-version == '3.12'
        # PYSEC-2022-252: historical PyPI account takeover of deep-translator;
        # no fixed release exists; 1.11.4 is the current upstream line.
        run: pip-audit --strict --ignore-vuln PYSEC-2022-252

      - name: Security scan with bandit
        if: matrix.python-version == '3.12'
        # B608: f-string SQL with bound ? placeholders (IN-clause builders), not user SQL.
        run: bandit -r skyadmin_pro/ --severity-level medium --skip B608

      - name: Security scan with semgrep
        if: matrix.python-version == '3.12'
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python

  perf:
    # Dedicated performance gate: budget tests block the build, and per-test
    # timings upload as JUnit XML for run-over-run history (90-day retention).
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run performance budgets
        run: pytest tests/test_performance_clients.py tests/test_performance_stress.py -q --tb=short --durations=15 --timeout=120 --junitxml=perf-results.xml
        env:
          SKYADMIN_SKIP_DAILY_CHECK: "1"

      - name: Upload perf timings
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: perf-timings-${{ github.sha }}
          path: perf-results.xml
          retention-days: 90

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skyadmin-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skyadmin-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck worker
        run: npx tsc --noEmit

      - name: Test worker
        run: npm test

      - name: Security scan with semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/typescript

      - name: Audit Worker dependencies
        run: npm audit --audit-level=high
