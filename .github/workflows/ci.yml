name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          SKYADMIN_SKIP_DAILY_CHECK: "1"

      - name: Audit Python dependencies
        run: pip-audit --strict

      - name: Security scan with bandit
        run: bandit -r skyadmin_pro/ -c pyproject.toml --severity-level medium

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skyadmin-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skyadmin-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck worker
        run: npx tsc --noEmit

      - name: Test worker
        run: npm test

      - name: Security scan with semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/typescript
          generatingCode: false

      - name: Audit Worker dependencies
        run: npm audit --audit-level=moderate
