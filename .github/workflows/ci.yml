name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Run tests
        run: pytest tests/ -v --tb=short --ignore=tests/test_performance_clients.py --ignore=tests/test_performance_stress.py
        env:
          SKYADMIN_SKIP_DAILY_CHECK: "1"
          SKYADMIN_PROCESS_OFFLOAD: "0"

      - name: Audit Python dependencies
        run: pip-audit --strict

      - name: Security scan with bandit
        run: bandit -r skyadmin_pro/ -c pyproject.toml --severity-level medium

  perf:
    # Dedicated performance gate: budget tests block the build, and per-test
    # timings upload as JUnit XML for run-over-run history (90-day retention).
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run performance budgets
        run: pytest tests/test_performance_clients.py tests/test_performance_stress.py -q --tb=short --durations=15 --junitxml=perf-results.xml
        env:
          SKYADMIN_SKIP_DAILY_CHECK: "1"

      - name: Upload perf timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-timings-${{ github.sha }}
          path: perf-results.xml
          retention-days: 90

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skyadmin-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skyadmin-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck worker
        run: npx tsc --noEmit

      - name: Test worker
        run: npm test

      - name: Security scan with semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/typescript
          generatingCode: false

      - name: Audit Worker dependencies
        run: npm audit --audit-level=moderate
