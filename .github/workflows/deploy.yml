name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "skyadmin-worker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Prevent overlapping migrate+deploy runs on main (schema ahead of code risk).
concurrency:
  group: skyadmin-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Tip: add `environment: production` here after creating a protected
    # GitHub Environment (required reviewers / wait timer) in repo settings.
    defaults:
      run:
        working-directory: skyadmin-worker

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skyadmin-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc --noEmit
          npm test

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply skyadmin-db --remote

      - name: Deploy worker to Cloudflare
        run: npx wrangler deploy

      - name: Smoke test against deployed worker
        run: |
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors --max-time 15 https://skyadmin-worker.skyadmin-pro.workers.dev/api/ping
