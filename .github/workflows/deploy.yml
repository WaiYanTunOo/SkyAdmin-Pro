name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - "skyadmin-worker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skyadmin-worker

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skyadmin-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx wrangler d1 execute skyadmin-db --remote --file=schema.sql

      - name: Deploy worker to Cloudflare
        run: npx wrangler deploy

      - name: Smoke test against deployed worker
        run: |
          sleep 5
          curl --fail https://skyadmin-worker.skyadmin-pro.workers.dev/api/ping
